apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: book-info-vs
  namespace: default
spec:
  hosts:
  - productpage
  - "book.info.com"
  gateways:
  - istio-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: productpage
        port:
          number: 9080